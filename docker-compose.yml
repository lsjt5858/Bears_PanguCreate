version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: pangudata-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-Lx123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pangudata}
      MYSQL_USER: ${MYSQL_USER:-pangudata}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Lx123456}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - pangudata-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-Lx123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pangudata-backend
    restart: always
    environment:
      # Flask配置
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      
      # 数据库配置
      DB_TYPE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-pangudata}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Lx123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pangudata}
      
      # CORS配置
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
    ports:
      - "5001:5001"
    volumes:
      - ./backend/data:/app/data
      - ./backend/.env:/app/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pangudata-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pangudata-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pangudata-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  pangudata-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
